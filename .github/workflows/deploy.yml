name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install

      - name: Build site
        run: npm run build

      - name: Copy JSON files to dist
        run: |
          cp public/news.json dist/news.json || true
          cp public/astuces.json dist/astuces.json || true
          cp public/news-archives.json dist/news-archives.json || true
          cp public/videos.json dist/videos.json || true
          if [ -d "public/videos" ]; then cp -r public/videos dist/videos; fi

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          force: true
          single-commit: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
